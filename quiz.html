<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffd7e8"><title>5 thử thách — VIP Dating</title><link rel="stylesheet" href="style.css">
</head>
<body class="game-page">
  <main class="quiz-shell">
    <header class="level-header">
      <a class="mini-brand" href="intro.html">🐾 VIP Dating</a><span id="question-counter">Câu 1/5</span>
    </header>
    <div class="progress-track" aria-label="Tiến trình câu hỏi"><div id="progress-fill" class="progress-fill"></div></div>
    <section class="glass-card quiz-card">
      <div id="quiz-emoji" class="big-emoji" aria-hidden="true">💗</div>
      <p class="kicker">THỬ THÁCH ĐÁNG YÊU</p>
      <h1 id="question-text">Đang tải câu hỏi...</h1>
      <div id="answer-list" class="answer-list"></div>
      <div id="answer-feedback" class="feedback" aria-live="polite"></div>
      <div class="quiz-controls"><button id="next-question" class="btn btn-primary next-btn" disabled aria-label="Sang câu tiếp theo">➜</button></div>
    </section>
    <p class="tiny-note center-text">Cứ bình tĩnh nhé, đặc vụ. Mèo luôn tin bạn. 🐈</p>
  </main>
  <div id="confetti-layer" class="confetti-layer" aria-hidden="true"></div>
  <script src="app.js"></script><script src="quiz.js"></script>
</body>
</html>
