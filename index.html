<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffd7e8">
  <title>VIP Dating — Xác thực</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <div class="floating-cat cat-one" aria-hidden="true">🐱</div>
  <div class="floating-cat cat-two" aria-hidden="true">😽</div>
  <div class="floating-cat cat-three" aria-hidden="true">🐈</div>
  <main class="login-shell">
    <div class="eyebrow">✦ PRIVATE LOVE SERVER ✦</div>
    <div class="mascot" aria-hidden="true">😼</div>
    <h1>Hệ thống Xác thực<br><span>VIP Dating</span></h1>
    <p class="subtitle">Vui lòng nhập mật mã riêng tư 💌</p>
    <form id="login-form" class="glass-card">
      <label for="username">Tài khoản</label>
      <input id="username" name="username" autocomplete="username" placeholder="Nhập tài khoản" required>
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật mã bí mật" required>
      <p id="login-error" class="error-message" role="alert" aria-live="polite"></p>
      <button class="btn btn-primary btn-wide" type="submit">Mở cổng tình yêu ✨</button>
      <p class="tiny-note">Chỉ dành cho người đặc biệt thôi đó!</p>
    </form>
    <footer>made with ♡ and a suspicious amount of cat energy</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
